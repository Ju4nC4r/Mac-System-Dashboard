services:
  dashboard:
    build:
      context: ./frontend
      target: runtime
    ports:
      - "8080:8080"
    environment:
      DASHBOARD_AUTH_USER: ${DASHBOARD_AUTH_USER:-}
      DASHBOARD_AUTH_PASSWORD: ${DASHBOARD_AUTH_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"
